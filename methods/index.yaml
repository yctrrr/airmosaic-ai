- method_id: emission_accounting
  version: 1.0.0
  research_question: Estimate primary emissions from explicit activity, technology shares and mutually exclusive
    control routes.
  disciplinary_basis: Activity-based mass accounting with pollutant-specific uncontrolled emission factors
    and remaining fractions.
  assumptions:
  - Activity and factor denominators share a declared physical basis.
  - Technology and control-route shares cover the activity without overlap.
  - Operating, capture and removal fractions represent the same activity-weighted conditions; factors do
    not already include these controls.
  applicability: Reviewed synthetic stationary/process accounting; real-data preparation, spatial allocation
    and uncertainty propagation need separate review.
  implementation:
    route: reviewed_direct_script
    runner_registered: false
    validation_scope: synthetic_numeric_unit_share_control_and_path_checks
  scientific_evidence:
