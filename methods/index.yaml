schema_version: 2
reviewed_on: '2026-10-27'
purpose: Four-step documentation inventory and skill mapping; not a tool registry
  or workflow executor.
execution_performed_this_review: true
execution_scope: Three authorized API requests for ERA5 single levels, CAMS EAC4
  surface PM2.5 and CAMS global PM2.5 forecasts, plus one public PM2.5 station daily CSV and hourly long-table check, and one PANGAEA homogenized release archive with a seven-day sample, and one WorldPop Global2 official GeoTIFF with metadata and raster checks. GBD and CSMAR each have one bounded browser export and content check. These acquisitions used newly downloaded files only. The model-building source audit did not read original data or run models.
status_definitions:
  local_source: Source exists in a separate local project; no AirMosaic adapter.
  mixed: Some related AirMosaic tools exist; the whole workflow is not executable
    here.
  registered_tools: Listed executable adapters exist; individual reference IDs remain
    disabled and task readiness requires separate checks.
  reference: Method guidance only; no executable adapter for the described workflow.
  methods_only: Conceptual methods only; no concrete data, implementation code, source-script
    references or executable adapter.
