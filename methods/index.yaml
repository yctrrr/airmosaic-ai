status_definitions:
  local_source: Source exists in a separate local project; no AirMosaic adapter.
  mixed: Some related AirMosaic tools exist; the whole workflow is not executable
    here.
  registered_tools: Listed executable adapters exist; individual reference IDs remain
    disabled and task readiness requires separate checks.
  reference: Method guidance only; no executable adapter for the described workflow.
  methods_only: Conceptual methods only; no concrete data, implementation code, source-script
    references or executable adapter.
