- method_id: cams_acquisition
  version: 1.0.0
  research_question: Obtain atmospheric-composition backgrounds while preserving product, species, grid
    and sampling identity.
  disciplinary_basis: Composition modelling and observation assimilation; column AOD and surface mass concentration
    are different quantities.
  assumptions:
