  version: 1.0.0
  research_question: Obtain meteorological covariates with known physical variables, levels, times and grids.
  disciplinary_basis: Atmospheric reanalysis combines a numerical model and observations; grid values are
    not station observations.
  assumptions:
  - Dataset, variable identity, layer, units and time support match the intended covariate.
  - Local-day aggregation follows verified temporal semantics and product-specific completeness.
  applicability: Declared ERA5 meteorology through the official CDS client or browser; AOD requires a separately
    identified product.
