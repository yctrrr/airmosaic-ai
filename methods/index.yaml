schema_version: 2
reviewed_on: '2026-10-29'
purpose: Four-step documentation inventory and skill mapping; not a tool registry or workflow executor.
execution_performed_this_review: false
execution_scope: Documentation and interface review with synthetic checks only; no acquisition, existing research-data
  reads, credential access or real-model computation. Dated live evidence remains in SOURCES.md and source-specific
  references.
status_definitions:
  local_source: Source exists in a separate local project; no AirMosaic adapter.
  mixed: Some related AirMosaic tools exist; the whole workflow is not executable here.
  registered_tools: Listed executable adapters exist; individual reference IDs remain disabled and task readiness
    requires separate checks.
  reviewed_direct_script: Reviewed bounded skill scripts are available; no run-tool or MCP execution adapter is
    registered for this method.
  reference: Method guidance only; no executable adapter for the described workflow.
  methods_only: Conceptual methods only; no concrete data, implementation code, source-script references or executable
    adapter.
