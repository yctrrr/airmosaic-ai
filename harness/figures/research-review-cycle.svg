<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1446" viewBox="0 0 1200 1446" role="img" aria-labelledby="title desc">
<title id="title">Connect research around scientific questions</title>
<desc id="desc">The scientific chain connects socioeconomic and natural change, emissions, atmospheric transport and chemistry, and integrated impacts. Methods, skills, workflows and shared runtime services support projects. The main sequence is projects retaining experimental results, human scientific review, and selected approved outputs entering a single assets node. Reports and review records stay with projects. Feedback improves projects and workflows. Feedback rails lie outside the content area. Asset internals are not prescribed.</desc>
