<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1446" viewBox="0 0 1200 1446" role="img" aria-labelledby="title desc">
<title id="title">围绕科学问题，连接研究环节</title>
<desc id="desc">研究主线涵盖社会经济与自然变化、排放清单、大气输送与化学、综合影响评估。方法、技能、工作流及公共运行服务支持项目实验。主线为 projects 保存实验结果，再提交人类科学审核，只有经审核通过的选定成果才进入唯一的 assets 节点。项目报告和审核记录保存在项目中；反馈可改进项目与工作流。两侧反馈线路位于内容区之外，不规定 assets 内部结构。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC","Segoe UI",Arial,sans-serif;fill:#183449}.minor{fill:#496578}</style>
