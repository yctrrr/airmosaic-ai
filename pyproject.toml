[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airmosaic-core"
version = "0.1.0"
description = "Shared runtime services, CLI and MCP for AirMosaic AI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0.1",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
tools = ["pandas", "openpyxl", "requests", "websocket-client"]
mcp = ["mcp==2.3.0"]
dev = [
    "pytest>=8.0",
]

[project.scripts]
airmosaic = "runtime.cli:main"
airmosaic-mcp = "runtime.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime", "runtime.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["harness/checks"]

