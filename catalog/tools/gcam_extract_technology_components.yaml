schema_version: 1
tool_id: gcam_extract_technology_components
title: 提取 GCAM 技术组件
description: 调用 Java/BaseX 提取已有情景结果，需先核对情景数据库和单位。
category: model
skill_id: gcam-data-extraction
owner_role: model-maintainer
implementation_status: implemented
registration_status: registered
entrypoint:
  kind: python_script
  path: skills/model/04_integrated_impacts/gcam/03_data_extraction/scripts/xquery_technology_components.py
  argument_bindings:
    scenarios: --scenarios
    regions: --regions
    sectors: --sectors
    years: --years
    out_dir: --out-dir
input_schema:
  type: object
  properties:
    scenarios:
      type: string
      description: Value supplied for this task.
      pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}(,[A-Za-z0-9][A-Za-z0-9_.-]{0,127})*$
    regions:
      type: string
      description: Value supplied for this task.
    sectors:
      type: string
      description: Value supplied for this task.
    years:
      type: string
      description: Value supplied for this task.
      pattern: ^\d{4}(,\d{4})*$
    out_dir:
      type: string
      description: Explicit task output directory under ${AIRMOSAIC_ASSETS_DIR}/results/<project_id>/<run_id>/<stage>/.
  required:
  - scenarios
  - sectors
  - out_dir
  additionalProperties: false
output_schema:
  type: object
requirements:
  python: '>=3.10'
  python_packages:
  - pandas
  executables:
  - java
  r_packages: []
  configuration:
  - name: AIRMOSAIC_ASSETS_DIR
    role: workspace
    kind: directory
  - name: GCAM_RELEASE_DIR
    role: model
    kind: directory
  resources:
  - root: GCAM_RELEASE_DIR
    path: libs/jars
    kind: directory
  manual_checks:
  - Verify a compatible BaseX JAR and selected scenario database before execution.
authentication:
  method: none
effects:
  reads:
  - model_release
  writes:
  - task_output
  network: false
documentation: harness/usage/model-analysis.md
execution:
  enabled: true
  adapter: gcam_extract
  path_parameters:
    out_dir: output_directory
