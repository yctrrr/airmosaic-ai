schema_version: 1
tool_id: gcam_plot_sector_change
title: 绘制 GCAM 行业变化
description: 固定比较 2021/2035；run-tool 注入本次任务输出目录。
category: model
skill_id: gcam-data-extraction
owner_role: model-maintainer
implementation_status: implemented
registration_status: registered
entrypoint:
  kind: r_script
  path: skills/model/IAM/gcam/03_data_extraction/scripts/plot_sector_change.R
  argument_bindings:
    sectors: --sectors
    scenarios: --scenarios
    input_csv: --input-csv
    out_dir: env:UNIT_PRICE_OUT_DIR
input_schema:
  type: object
  properties:
    sectors:
      type: string
      description: Comma-separated non-empty names; no leading option markers.
      pattern: ^[A-Za-z0-9][A-Za-z0-9 _.()-]*(,[A-Za-z0-9][A-Za-z0-9 _.()-]*)*$
    scenarios:
      type: string
      description: Comma-separated non-empty names; no leading option markers.
      pattern: ^[A-Za-z0-9][A-Za-z0-9 _.()-]*(,[A-Za-z0-9][A-Za-z0-9 _.()-]*)*$
    input_csv:
      type: string
      description: Existing market_sector_rows.csv inside workspace data_cache or
        output; filename must not contain commas.
    out_dir:
      type: string
      description: Task output directory; supplied by the runner.
  required:
  - input_csv
  - out_dir
  additionalProperties: false
output_schema:
  type: object
requirements:
  python: '>=3.10'
  python_packages: []
  executables:
  - Rscript
  r_packages:
  - dplyr
  - ggplot2
  - readr
  - tidyr
  configuration:
  - name: AIRMOSAIC_ASSETS_DIR
    role: workspace
    kind: directory
  resources: []
  manual_checks: []
authentication:
  method: none
effects:
  reads:
  - task_output
  writes:
  - task_output
  network: false
documentation: harness/usage/model-analysis.md
execution:
  enabled: true
  adapter: gcam_plot
  path_parameters:
    input_csv: input_file
    out_dir: output_directory
