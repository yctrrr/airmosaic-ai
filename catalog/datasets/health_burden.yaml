dataset_id: gbd_health
name: Baseline Mortality and Demographic Health Estimates
domain: health
description: Baseline mortality, demographic strata and disease endpoints for health burden analysis. Exposure-response functions are a separate input described by pm25_exposure_response.
spatial_coverage: China and subnational regions when available
spatial_resolution: national or administrative unit
temporal_coverage: dataset-dependent
temporal_resolution: annual
formats:
  - csv
  - xlsx
  - rds
variables:
  - name: MortRate
    description: Baseline mortality rate.
    unit: deaths per 100000 population
  - name: agegroup
    description: Age group.
    unit: category
access_method: official GBD Results exports or authorized baseline-health tables and their codebooks
license_or_terms: Source-specific health data terms apply.
local_cache_policy: Cache only derived or authorized parameter tables.
default_cache_root: ${AIRMOSAIC_ASSETS_DIR}/data/04_integrated_impacts/GBD_HealthBurden

acquisition_skill: skills/data_acquisition/04_integrated_impacts/ihme-gbd-results
quality_notes: Match cause, age, sex, year, location and rate denominator. Age-standardized rates cannot reconstruct actual deaths. A GBD Results export does not supply an exposure-response curve by default.
related_datasets:
  - pm25_exposure_response
example_queries:
  - cause-specific age-sex baseline mortality rates
  - age-specific baseline mortality for China 2019
